server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml font/woff2;

    add_header X-Content-Type-Options nosniff;

    # Assets com hash do build: cache imutável
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Imagens e vídeos (incluindo o vídeo local em /videos/)
    location ~* \.(png|jpg|jpeg|svg|webp|avif|mp4|webm)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}