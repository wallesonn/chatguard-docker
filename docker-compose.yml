#Este repositorio é publico 
#Stack do ChatGuard: aplicação (export estático servido por nginx) + Postgres
# local. O Traefik já roda na VPS (fora desta stack) e encaminha chatguard.life
# para o serviço app via labels na rede externa "web" — a mesma configuração
# usada pelas demais stacks da VPS (inlaudo).
#
# Build/publish da imagem: ./build.sh vX.Y.Z na raiz do repo do app.
# Deploy: Portainer (web editor ou este repo via GitHub) ou CLI na VPS.
# Sem bloco build de propósito: a imagem é sempre puxada pronta do Docker Hub.
#
# O Postgres fica provisionado nesta stack para o backend futuro (cadastro,
# dashboard). A landing atual é estática e ainda não o utiliza.

services:
  app:
    image: ${DOCKER_IMAGE:-wallesonnn/chatguard-app:latest}
    container_name: chatguard-app
    restart: unless-stopped
    expose:
      - "80"
    environment:
      # URL de conexão usada pelo backend futuro (host "db" = serviço abaixo)
      DATABASE_URL: postgresql://${POSTGRES_USER:-chatguard}:${POSTGRES_PASSWORD:-chatguard}@db:5432/${POSTGRES_DB:-chatguard}
      NODE_ENV: production
    networks:
      - default
      - web
    labels:
      - "app=chatguard"
      - "domain=chatguard.life"
      - "service=chatguard-app"
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.chatguard.rule=Host(`chatguard.life`)"
      - "traefik.http.routers.chatguard.entrypoints=websecure"
      - "traefik.http.routers.chatguard.tls=true"
      - "traefik.http.routers.chatguard.tls.certresolver=lets-encrypt"
      - "traefik.http.services.chatguard.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: postgres:17-alpine
    container_name: chatguard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chatguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatguard}
      POSTGRES_DB: ${POSTGRES_DB:-chatguard}
    # Acesso local apenas (loopback) para ferramentas do host. Se a porta 5432
    # já estiver ocupada na VPS, troque POSTGRES_PORT ou remova este bloco.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chatguard} -d ${POSTGRES_DB:-chatguard}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

networks:
  default:
  # Rede externa do Traefik já existente na VPS (a mesma do inlaudo)
  web:
    external: true